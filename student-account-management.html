
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Account Management</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:15px;color:#222}
.box{max-width:550px;margin:25px auto;background:white;padding:22px;border-radius:12px;box-shadow:0 2px 10px #0001}
h2{color:#0757a5;text-align:center}
label{display:block;margin-top:15px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:6px;box-sizing:border-box;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:13px;background:#0757a5;color:white;border:0;border-radius:7px;margin-top:18px;font-weight:bold;cursor:pointer}
#message{margin-top:15px;line-height:1.5;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="box">
<h2>Student Account Management</h2>
<p>विद्यार्थी का Login Account बनाएँ</p>

<label>विद्यार्थी चुनें</label>
<select id="student">
<option value="">विद्यार्थी लोड हो रहे हैं...</option>
</select>

<label>विद्यार्थी का Email</label>
<input type="email" id="email" placeholder="student@gmail.com">

<label>Login Password</label>
<input type="password" id="password" placeholder="कम से कम 6 अक्षर">

<button id="createButton" onclick="createAccount()">Create Student Account</button>
<p id="message"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD4QuKWPD7ENTrtOch1bAsRVqOr6C7iguA",
  authDomain: "ks-computer-center.firebaseapp.com",
  projectId: "ks-computer-center",
  storageBucket: "ks-computer-center.firebasestorage.app",
  messagingSenderId: "261490969527",
  appId: "1:261490969527:web:4fc4dfb5b96bc6a89b7632"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

// Student account creation uses a separate Auth instance.
// This keeps the Admin logged in.
const secondaryApp = firebase.initializeApp(
  firebaseConfig,
  "StudentAccountCreator"
);
const studentAuth = secondaryApp.auth();

let adminUser = null;

auth.onAuthStateChanged(async user => {
  if (!user || user.email !== "naukriwithsk@gmail.com") {
    location.href = "./admin.html";
    return;
  }

  adminUser = user;
  loadStudents();
});

async function loadStudents() {
  const select = document.getElementById("student");
  select.innerHTML = '<option value="">विद्यार्थी चुनें</option>';

  try {
    const snapshot = await db.collection("admissions").get();

    snapshot.forEach(doc => {
      const s = doc.data();
      const option = document.createElement("option");
      option.value = doc.id;
      option.textContent =
        (s.name || "नाम नहीं") + " - " +
        (s.mobile || doc.id) + " - " +
        (s.course || "");
      select.appendChild(option);
    });
  } catch (error) {
    document.getElementById("message").textContent =
      "विद्यार्थी लोड नहीं हुए: " + error.message;
  }
}

async function createAccount() {
  if (!adminUser) return;

  const mobile = document.getElementById("student").value;
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");
  const button = document.getElementById("createButton");

  if (!mobile) {
    alert("पहले विद्यार्थी चुनें।");
    return;
  }

  if (!email || !email.includes("@")) {
    alert("सही Email लिखें।");
    return;
  }

  if (password.length < 6) {
    alert("Password कम से कम 6 अक्षर का होना चाहिए।");
    return;
  }

  button.disabled = true;
  message.textContent = "Account बनाया जा रहा है...";

  try {
    const admission = await db.collection("admissions")
      .doc(mobile).get();

    if (!admission.exists) {
      throw new Error("विद्यार्थी का रिकॉर्ड नहीं मिला।");
    }

    const credential = await studentAuth
      .createUserWithEmailAndPassword(email, password);

    const uid = credential.user.uid;

    await db.collection("studentAccounts").doc(uid).set({
      mobile: mobile,
      email: email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await studentAuth.signOut();

    document.getElementById("email").value = "";
    document.getElementById("password").value = "";

    message.textContent =
      "सफलता! विद्यार्थी का Login Account बन गया है।";

  } catch (error) {
    message.textContent =
      "Account नहीं बना: " + error.message;
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
