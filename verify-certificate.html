<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Verification - K.S. Computer Center</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:18px;color:#1f2937}.card{max-width:560px;margin:35px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 18px #0001}h2{text-align:center;color:#0757a5;margin-top:0}p{line-height:1.55}label{display:block;font-weight:bold;margin-top:18px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;margin-top:7px;font-size:16px}button{width:100%;padding:13px;background:#0757a5;color:#fff;border:0;border-radius:8px;margin-top:12px;font-weight:bold;font-size:15px;cursor:pointer}#result{display:none;margin-top:22px;padding:18px;border-radius:10px;background:#f8fafc;border:1px solid #dbe3ed}.status{font-weight:bold;color:#087443}.invalid{font-weight:bold;color:#b42318}.row{padding:9px 0;border-bottom:1px solid #e5e7eb;overflow-wrap:anywhere}.key{font-weight:bold;color:#475569}.note{font-size:13px;color:#64748b;text-align:center;margin-top:18px}
</style></head><body><div class="card"><h2>K.S. Computer Center</h2><h3>Online Certificate Verification</h3><p>Certificate की जाँच के लिए Certificate Number दर्ज करें। QR Code से आने पर नंबर अपने-आप भर जाएगा।</p><label for="certNumber">Certificate Number</label><input id="certNumber" type="text" placeholder="उदाहरण: KSCC-1794127178441"><button id="verifyButton" onclick="verifyCertificate()">Verify Certificate</button><div id="result" aria-live="polite"></div><p class="note">यह पेज केवल सार्वजनिक Certificate जानकारी दिखाता है। मोबाइल नंबर या निजी रिकॉर्ड नहीं दिखाया जाता।</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyD4QuKWPD7ENTrtOch1bAsRVqOr6C7iguA",authDomain:"ks-computer-center.firebaseapp.com",projectId:"ks-computer-center",storageBucket:"ks-computer-center.firebasestorage.app",messagingSenderId:"261490969527",appId:"1:261490969527:web:4fc4dfb5b96bc6a89b7632"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const cert=new URLSearchParams(location.search).get("cert");if(cert){document.getElementById("certNumber").value=cert;verifyCertificate();}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function verifyCertificate(){const number=document.getElementById("certNumber").value.trim(),result=document.getElementById("result"),btn=document.getElementById("verifyButton");if(!number){alert("Certificate Number दर्ज करें।");return;}btn.disabled=true;btn.textContent="जाँच हो रही है...";result.style.display="block";result.textContent="Certificate रिकॉर्ड जाँचा जा रहा है...";try{const snap=await db.collection("publicCertificates").doc(number).get();if(!snap.exists){result.innerHTML='<p class="invalid">✖ Invalid Certificate</p><p>इस Certificate Number का रिकॉर्ड नहीं मिला।</p>';return;}const d=snap.data();if(d.status!=="valid"){result.innerHTML='<p class="invalid">✖ Certificate वैध नहीं है</p><p>यह Certificate वर्तमान में मान्य नहीं है।</p><div class="row"><b>Certificate Number:</b> '+esc(d.certificateNumber||number)+'</div>';return;}result.innerHTML='<p class="status">✔ Verified — Valid Certificate</p><div class="row"><span class="key">Certificate Number:</span> '+esc(d.certificateNumber||number)+'</div><div class="row"><span class="key">Student Name:</span> '+esc(d.studentName)+'</div><div class="row"><span class="key">Course:</span> '+esc(d.course)+'</div><div class="row"><span class="key">Issue Date:</span> '+esc(d.issueDate)+'</div>';}catch(e){result.innerHTML='<p class="invalid">जाँच नहीं हो सकी।</p><p>'+esc(e.message)+'</p>';}finally{btn.disabled=false;btn.textContent="Verify Certificate";}}
</script></body></html>
