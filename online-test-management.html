
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Test Management - K.S. Computer Center</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}
header{background:#142b50;color:white;text-align:center;padding:20px}
.container{max-width:950px;margin:22px auto;padding:0 14px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 3px 12px #0001}
h3{color:#17365f;margin-top:0}
label{display:block;font-weight:bold;margin:13px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:7px;font-size:15px}
textarea{min-height:75px}
button{border:0;padding:12px 16px;border-radius:7px;font-weight:bold;cursor:pointer;margin-top:12px}
.primary{background:#174a87;color:white}
.green{background:#16834a;color:white}
.gray{background:#64748b;color:white}
.red{background:#b42318;color:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.status{padding:11px;background:#eff6ff;border-radius:7px;margin:12px 0}
.test-item{border:1px solid #dbe3ed;padding:14px;border-radius:9px;margin:12px 0}
.small{font-size:13px;color:#64748b}
.hidden{display:none}
@media(max-width:600px){.row{grid-template-columns:1fr}.card{padding:15px}}
</style>
</head>

<body>
<header>
<h2>K.S. Computer Center</h2>
<div>Admin Online Test Management</div>
</header>

<div class="container">

<div class="card">
<h3>Admin Login स्थिति</h3>
<div id="loginStatus" class="status">जाँच हो रही है...</div>
<button class="gray" onclick="logout()">Logout</button>
</div>

<div id="mainPanel" class="hidden">

<div class="card">
<h3>1. नया टेस्ट बनाएँ</h3>

<label>टेस्ट का नाम</label>
<input id="testTitle" placeholder="जैसे Basic Computer Test 1">

<div class="row">
<div>
<label>समय (मिनट)</label>
<input id="duration" type="number" min="1" max="300" value="30">
</div>
<div>
<label>कुल प्रश्न</label>
<input id="totalQuestions" type="number" min="1" max="200" value="1">
</div>
</div>

<label>टेस्ट के निर्देश</label>
<textarea id="instructions" placeholder="विद्यार्थियों के लिए निर्देश"></textarea>

<button class="primary" id="createBtn" onclick="createTest()">टेस्ट बनाएँ</button>
<div id="createMessage"></div>
</div>

<div class="card">
<h3>2. पुराने टेस्ट को Edit करें</h3>

<label>टेस्ट चुनें</label>
<select id="editTestSelect" onchange="loadSelectedTest()">
<option value="">टेस्ट चुनें</option>
</select>

<div id="editArea" class="hidden">
<div class="status" id="editInfo"></div>

<label>टेस्ट का नाम</label>
<input id="editTitle">

<div class="row">
<div>
<label>समय (मिनट)</label>
<input id="editDuration" type="number" min="1" max="300">
</div>
<div>
<label>कुल प्रश्न</label>
<input id="editTotal" type="number" min="1" max="200">
</div>
</div>

<label>निर्देश</label>
<textarea id="editInstructions"></textarea>

<button class="green" onclick="saveTestChanges()">बदलाव सेव करें</button>
<div id="editMessage"></div>
</div>
</div>

<div class="card">
<h3>3. प्रश्न और सही उत्तर जोड़ें</h3>

<label>टेस्ट चुनें</label>
<select id="questionTestSelect" onchange="loadQuestionTest()">
<option value="">टेस्ट चुनें</option>
</select>

<div id="questionArea" class="hidden">
<div class="status" id="questionInfo"></div>

<label>प्रश्न</label>
<textarea id="questionText" placeholder="प्रश्न लिखें"></textarea>

<label>विकल्प A</label>
<input id="option0" placeholder="विकल्प A">

<label>विकल्प B</label>
<input id="option1" placeholder="विकल्प B">

<label>विकल्प C</label>
<input id="option2" placeholder="विकल्प C">

<label>विकल्प D</label>
<input id="option3" placeholder="विकल्प D">

<label>सही उत्तर</label>
<select id="correctAnswer">
<option value="">सही उत्तर चुनें</option>
<option value="0">विकल्प A</option>
<option value="1">विकल्प B</option>
<option value="2">विकल्प C</option>
<option value="3">विकल्प D</option>
</select>

<button class="green" id="addQuestionBtn" onclick="addQuestion()">प्रश्न सेव करें</button>
<div id="questionMessage"></div>
</div>
</div>

<div class="card">
<h3>4. सभी टेस्ट</h3>
<button class="gray" onclick="loadTests()">Refresh</button>
<div id="testList">लोड हो रहा है...</div>
</div>

</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD4QuKWPD7ENTrtOch1bAsRVqOr6C7iguA",
  authDomain: "ks-computer-center.firebaseapp.com",
  projectId: "ks-computer-center",
  storageBucket: "ks-computer-center.firebasestorage.app",
  messagingSenderId: "261490969527",
  appId: "1:261490969527:web:4fc4dfb5b96bc6a89b7632"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = "naukriwithsk@gmail.com";

let selectedEditTest = null;
let selectedQuestionTest = null;

auth.onAuthStateChanged(user => {
  const status = document.getElementById("loginStatus");

  if (!user) {
    status.textContent = "Admin Login नहीं है। पहले Admin Login करें।";
    document.getElementById("mainPanel").classList.add("hidden");
    return;
  }

  if ((user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    status.textContent = "यह पेज केवल Admin के लिए है।";
    document.getElementById("mainPanel").classList.add("hidden");
    return;
  }

  status.textContent = "Admin Login सफल: " + user.email;
  document.getElementById("mainPanel").classList.remove("hidden");
  loadTests();
});

async function createTest() {
  const title = document.getElementById("testTitle").value.trim();
  const duration = Number(document.getElementById("duration").value);
  const total = Number(document.getElementById("totalQuestions").value);
  const instructions = document.getElementById("instructions").value.trim();
  const msg = document.getElementById("createMessage");

  if (!title) return msg.textContent = "टेस्ट का नाम लिखें।";
  if (!Number.isInteger(duration) || duration < 1 || duration > 300)
    return msg.textContent = "समय 1 से 300 मिनट रखें।";
  if (!Number.isInteger(total) || total < 1 || total > 200)
    return msg.textContent = "प्रश्न संख्या 1 से 200 रखें।";

  const btn = document.getElementById("createBtn");
  btn.disabled = true;
  msg.textContent = "सेव हो रहा है...";

  try {
    await db.collection("tests").add({
      title,
      durationMinutes: duration,
      totalQuestions: total,
      instructions,
      active: false,
      questionCount: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdBy: auth.currentUser.uid
    });

    msg.textContent = "टेस्ट सफलतापूर्वक बन गया।";
    document.getElementById("testTitle").value = "";
    document.getElementById("instructions").value = "";
    await loadTests();

  } catch (e) {
    msg.textContent = "Error: " + e.message;
  }

  btn.disabled = false;
}

async function loadTests() {
  const list = document.getElementById("testList");
  const editSelect = document.getElementById("editTestSelect");
  const questionSelect = document.getElementById("questionTestSelect");

  list.textContent = "लोड हो रहा है...";
  editSelect.innerHTML = '<option value="">टेस्ट चुनें</option>';
  questionSelect.innerHTML = '<option value="">टेस्ट चुनें</option>';

  try {
    const snap = await db.collection("tests").orderBy("createdAt", "desc").get();
    list.innerHTML = "";

    if (snap.empty) {
      list.textContent = "अभी कोई टेस्ट नहीं है।";
      return;
    }

    snap.forEach(doc => {
      const t = doc.data();

      [editSelect, questionSelect].forEach(select => {
        const opt = document.createElement("option");
        opt.value = doc.id;
        opt.textContent = t.title || "बिना नाम का टेस्ट";
        select.appendChild(opt);
      });

      const item = document.createElement("div");
      item.className = "test-item";

      const heading = document.createElement("h4");
      heading.textContent = t.title || "बिना नाम का टेस्ट";

      const details = document.createElement("div");
      details.className = "small";
      details.textContent =
        "समय: " + t.durationMinutes + " मिनट | प्रश्न: " +
        (t.questionCount || 0) + "/" + t.totalQuestions +
        " | स्थिति: " + (t.active ? "Active" : "Inactive");

      const btn = document.createElement("button");
      btn.className = t.active ? "red" : "green";
      btn.textContent = t.active ? "टेस्ट बंद करें" : "टेस्ट Active करें";
      btn.onclick = () => toggleTest(doc.id, t);

      item.append(heading, details, btn);
      list.appendChild(item);
    });

  } catch (e) {
    list.textContent = "टेस्ट लोड नहीं हुए: " + e.message;
  }
}

async function loadSelectedTest() {
  const id = document.getElementById("editTestSelect").value;
  const area = document.getElementById("editArea");

  selectedEditTest = null;

  if (!id) {
    area.classList.add("hidden");
    return;
  }

  try {
    const doc = await db.collection("tests").doc(id).get();
    if (!doc.exists) return;

    selectedEditTest = {id, ...doc.data()};

    document.getElementById("editTitle").value = selectedEditTest.title || "";
    document.getElementById("editDuration").value = selectedEditTest.durationMinutes || 30;
    document.getElementById("editTotal").value = selectedEditTest.totalQuestions || 1;
    document.getElementById("editInstructions").value = selectedEditTest.instructions || "";

    document.getElementById("editInfo").textContent =
      "अभी " + (selectedEditTest.questionCount || 0) +
      " प्रश्न सेव हैं। कुल प्रश्नों की संख्या इससे कम नहीं रख सकते।";

    document.getElementById("editMessage").textContent = "";
    area.classList.remove("hidden");

  } catch (e) {
    alert("टेस्ट नहीं खुला: " + e.message);
  }
}

async function saveTestChanges() {
  if (!selectedEditTest) return;

  const title = document.getElementById("editTitle").value.trim();
  const duration = Number(document.getElementById("editDuration").value);
  const total = Number(document.getElementById("editTotal").value);
  const instructions = document.getElementById("editInstructions").value.trim();
  const msg = document.getElementById("editMessage");

  if (!title) return msg.textContent = "टेस्ट का नाम लिखें।";
  if (!Number.isInteger(duration) || duration < 1 || duration > 300)
    return msg.textContent = "समय 1 से 300 मिनट रखें।";
  if (!Number.isInteger(total) || total < 1 || total > 200)
    return msg.textContent = "कुल प्रश्न 1 से 200 रखें।";

  if (total < (selectedEditTest.questionCount || 0)) {
    return msg.textContent = "कुल प्रश्न सेव किए गए प्रश्नों से कम नहीं हो सकते।";
  }

  try {
    await db.collection("tests").doc(selectedEditTest.id).update({
      title,
      durationMinutes: duration,
      totalQuestions: total,
      instructions
    });

    msg.textContent = "टेस्ट की जानकारी अपडेट हो गई।";
    await loadTests();
    await loadSelectedTest();

  } catch (e) {
    msg.textContent = "अपडेट नहीं हुआ: " + e.message;
  }
}

async function loadQuestionTest() {
  const id = document.getElementById("questionTestSelect").value;
  const area = document.getElementById("questionArea");

  selectedQuestionTest = null;

  if (!id) {
    area.classList.add("hidden");
    return;
  }

  try {
    const doc = await db.collection("tests").doc(id).get();
    if (!doc.exists) return;

    selectedQuestionTest = {id, ...doc.data()};

    document.getElementById("questionInfo").textContent =
      selectedQuestionTest.title + " — " +
      (selectedQuestionTest.questionCount || 0) + "/" +
      selectedQuestionTest.totalQuestions + " प्रश्न सेव हैं।";

    document.getElementById("questionMessage").textContent = "";
    area.classList.remove("hidden");

  } catch (e) {
    alert("टेस्ट नहीं खुला: " + e.message);
  }
}

async function addQuestion() {
  const msg = document.getElementById("questionMessage");
  const btn = document.getElementById("addQuestionBtn");

  if (!selectedQuestionTest) return msg.textContent = "पहले टेस्ट चुनें।";

  const question = document.getElementById("questionText").value.trim();
  const options = [0,1,2,3].map(i =>
    document.getElementById("option" + i).value.trim()
  );
  const correct = document.getElementById("correctAnswer").value;

  if (!question) return msg.textContent = "प्रश्न लिखें।";
  if (options.some(x => !x)) return msg.textContent = "चारों विकल्प भरें।";
  if (correct === "") return msg.textContent = "सही उत्तर चुनें।";

  if ((selectedQuestionTest.questionCount || 0) >= selectedQuestionTest.totalQuestions)
    return msg.textContent = "इस टेस्ट के सभी प्रश्न जुड़ चुके हैं।";

  btn.disabled = true;
  msg.textContent = "प्रश्न सेव हो रहा है...";

  try {
    const testId = selectedQuestionTest.id;
    const questionRef = db.collection("testQuestions")
      .doc(testId).collection("questions").doc();

    const answerRef = db.collection("testAnswerKeys")
      .doc(testId).collection("answers").doc(questionRef.id);

    const batch = db.batch();

    batch.set(questionRef, {
      question,
      options,
      order: (selectedQuestionTest.questionCount || 0) + 1
    });

    batch.set(answerRef, {
      correctOption: Number(correct)
    });

    batch.update(db.collection("tests").doc(testId), {
      questionCount: firebase.firestore.FieldValue.increment(1)
    });

    await batch.commit();

    msg.textContent = "प्रश्न सफलतापूर्वक सेव हो गया।";

    document.getElementById("questionText").value = "";
    [0,1,2,3].forEach(i => document.getElementById("option" + i).value = "");
    document.getElementById("correctAnswer").value = "";

    await loadQuestionTest();
    await loadTests();

  } catch (e) {
    msg.textContent = "प्रश्न सेव नहीं हुआ: " + e.message;
  }

  btn.disabled = false;
}

async function toggleTest(id, test) {
  if (!test.active && (test.questionCount || 0) !== test.totalQuestions) {
    alert("टेस्ट Active करने से पहले सभी प्रश्न जोड़ें।");
    return;
  }

  if (!confirm(test.active ? "टेस्ट बंद करें?" : "टेस्ट Active करें?")) return;

  try {
    await db.collection("tests").doc(id).update({
      active: !test.active
    });
    await loadTests();
    alert("टेस्ट की स्थिति अपडेट हो गई।");
  } catch (e) {
    alert("अपडेट नहीं हुआ: " + e.message);
  }
}

async function logout() {
  await auth.signOut();
  window.location.href = "./admin.html";
}
</script>
</body>
</html>
