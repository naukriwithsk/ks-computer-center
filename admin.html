<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K.S. Computer Center — Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #073b7a, #0879c9);
      padding: 16px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 8px 30px #0003;
    }

    h1 {
      color: #0757a5;
      text-align: center;
      margin-top: 0;
    }

    p {
      text-align: center;
      color: #64748b;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #0879c9;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      line-height: 1.5;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #0757a5;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>Admin Login</h1>
    <p>K.S. Computer Center</p>

    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input
        id="email"
        type="email"
        placeholder="Admin email लिखें"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Password लिखें"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">Login</button>
      <p id="message" aria-live="polite"></p>
    </form>

    <a class="back" href="./index.html">← मुख्य वेबसाइट पर जाएँ</a>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- Firebase और Login Code -->
  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyD4QuKWPD7ENTrtOch1bAsRVqOr6C7iguA",
  authDomain: "ks-computer-center.firebaseapp.com",
  projectId: "ks-computer-center",
  storageBucket: "ks-computer-center.firebasestorage.app",
  messagingSenderId: "261490969527",
  appId: "1:261490969527:web:4fc4dfb5b96bc6a89b7632"
};

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      loginButton.disabled = true;
      loginButton.textContent = "Login हो रहा है...";
      message.style.color = "#64748b";
      message.textContent = "कृपया प्रतीक्षा करें...";

      try {
        await auth.signInWithEmailAndPassword(email, password);

        message.style.color = "green";
        message.textContent =
          "Login सफल हुआ! अभी Dashboard तैयार नहीं है।";
        window.location.href = "./admin-dashboard.html";

      } catch (error) {
        message.style.color = "red";

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {
          message.textContent = "Email या Password सही नहीं है।";
        } else if (error.code === "auth/invalid-email") {
          message.textContent = "कृपया सही Email लिखें।";
        } else if (error.code === "auth/too-many-requests") {
          message.textContent =
            "बहुत बार कोशिश हुई है। कुछ देर बाद फिर कोशिश करें।";
        } else {
          message.textContent =
            "Login नहीं हो पाया: " + error.message;
        }

      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }
    });
  </script>
</body>
</html>
